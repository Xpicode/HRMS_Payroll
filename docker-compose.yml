# Local development stack: app (Next.js dev server) + db (PostgreSQL 16) + jobs (runner).
# `docker compose up` on a fresh clone installs dependencies, applies migrations,
# seeds the first admin and starts the app on http://localhost:8080.
#
# Requires a `.env` (copy `.env.example`). The db port is bound to 127.0.0.1 only so
# it is reachable from the host for `pnpm dev` / Prisma Studio but not from the LAN.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - hrms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms} -d ${POSTGRES_DB:-hrms}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Overrides for the container network / volume layout
      DATABASE_URL: postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrms}?schema=public
      DATA_DIR: /data
      AUTH_URL: ${AUTH_URL:-http://localhost:8080}
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      npm_config_store_dir: /pnpm/store
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - .:/app
      - hrms_node_modules:/app/node_modules
      - hrms_next:/app/.next
      - hrms_data:/data
      - hrms_pnpm:/pnpm
    command: ["/app/docker/dev-entrypoint.sh"]

  # Job runner: pokes the app every minute so queued jobs (payslip PDFs) run even when the
  # request that queued them is gone. Idempotent; the app also runs jobs right after Approve.
  jobs:
    image: curlimages/curl:8.14.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      JOBS_TOKEN: ${JOBS_TOKEN:?set JOBS_TOKEN in .env}
    command:
      - sh
      - -c
      - |
        while true; do
          curl -s -o /dev/null -w 'jobs: %{http_code}\n' -X POST \
            -H "Authorization: Bearer $$JOBS_TOKEN" http://app:8080/api/jobs/run || true
          sleep 60
        done

volumes:
  hrms_pgdata:
  hrms_pnpm:
  hrms_node_modules:
  hrms_next:
  hrms_data:
