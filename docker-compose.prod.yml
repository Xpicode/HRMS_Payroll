# Production stack: app (production image) + db (PostgreSQL 16) + jobs (runner).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Reads `.env` (copy `.env.example`; see docs/deployment.md). The app listens on
# APP_BIND:APP_PORT (127.0.0.1:8080 by default) and expects a reverse proxy to terminate HTTPS;
# the database is never published. Persistent state lives in two volumes — set
# HRMS_DATA_PATH / HRMS_PGDATA_PATH to host folders (Synology: /volume1/docker/hrms/...) to use
# bind mounts instead of the named volumes.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
    volumes:
      - ${HRMS_PGDATA_PATH:-hrms_pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms} -d ${POSTGRES_DB:-hrms}"]
      interval: 10s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    image: ${APP_IMAGE:-hrms-payroll:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrms}?schema=public
      DATA_DIR: /data
      AUTH_URL: ${AUTH_URL:?set AUTH_URL to the public https URL in .env}
      SEED_DEMO_COMPANY: ${SEED_DEMO_COMPANY:-false}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - ${HRMS_DATA_PATH:-hrms_data}:/data
    # Chromium renders every payslip; give it headroom and a real /dev/shm.
    shm_size: 512m
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-2g}
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Job runner: pokes the app every minute so queued jobs (payslip PDFs, emails, rollovers)
  # run even when the request that queued them is gone.
  jobs:
    image: curlimages/curl:8.14.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      JOBS_TOKEN: ${JOBS_TOKEN:?set JOBS_TOKEN in .env}
    command:
      - sh
      - -c
      - |
        while true; do
          curl -s -o /dev/null -w 'jobs: %{http_code}\n' -X POST \
            -H "Authorization: Bearer $$JOBS_TOKEN" http://app:8080/api/jobs/run || true
          sleep 60
        done
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  hrms_pgdata:
  hrms_data:
